name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security issues** must not be reported here: see SECURITY.md.
        Please never paste real financial data, passwords or `.env` contents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Konto?
      options:
        - Docker (docker-compose.yml)
        - Docker with the Tailscale sidecar
        - Manual install (PM2 or similar)
        - Development (npm run dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Konto version or commit
      placeholder: e.g. v2.0.0 or a commit hash
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15 Pro, Safari, installed on the home screen
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - Italian
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server logs (`docker compose logs`) or screenshots, with personal data removed.
